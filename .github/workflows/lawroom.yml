name: Lawroom checks and Pages
on:
  push:
    branches: [main, feature/lawroom]
    paths: ['lawroom/**', '.github/workflows/lawroom.yml']
  pull_request:
    paths: ['lawroom/**', '.github/workflows/lawroom.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lawroom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lawroom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lawroom/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:sql
      - run: npm run build:pages
        env:
          VITE_DATA_MODE: demo
          VITE_BASE_PATH: /law/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: lawroom/dist
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
